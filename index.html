<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Notes — a private, local-first, zero-friction notes app." />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="icon" type="image/png" sizes="32x32" href="/notes/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/notes/apple-touch-icon.png" />
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem('notes.theme');
          const preference = ['system', 'light', 'dark'].includes(stored) ? stored : 'system';
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>Notes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
