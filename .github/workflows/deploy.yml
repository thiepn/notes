name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify certified SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: production smoke
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live production shell, manifest and service worker
        env:
          PROD_URL: https://thiepn.dev/notes/
        run: |
          set -euo pipefail

          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "$1" -o "$2"
          }

          fetch "$PROD_URL" /tmp/notes-index.html
          grep -F '<div id="root"></div>' /tmp/notes-index.html
          grep -F '<title>Notes</title>' /tmp/notes-index.html

          fetch "${PROD_URL}manifest.webmanifest" /tmp/manifest.webmanifest
          fetch "${PROD_URL}sw.js" /tmp/sw.js
          test -s /tmp/sw.js

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('/tmp/manifest.webmanifest', 'utf8'));
          if (manifest.name !== 'Notes') throw new Error('Production manifest name mismatch.');
          if (manifest.start_url !== '/notes/') throw new Error('Production manifest start_url mismatch.');
          if (manifest.scope !== '/notes/') throw new Error('Production manifest scope mismatch.');
          NODE

          echo "Production static smoke passed for $PROD_URL"

      - name: Checkout certified production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node for production browser smoke
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install production smoke dependencies
        run: npm ci --no-audit --no-fund

      - name: Install production smoke browser
        run: npx playwright install --with-deps chromium

      - name: Verify live rich Share-to-Notes capture
        env:
          PROD_URL: https://thiepn.dev/notes/
        run: npm run e2e:production-share

      - name: Retain production smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.event.workflow_run.head_sha }}
          path: production-smoke-results
          retention-days: 7
          if-no-files-found: warn

  release:
    name: stable release marker
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: write
    steps:
      - name: Checkout certified production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Publish marked stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          package_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          release_tag="v$package_version"
          subject="$(git log -1 --pretty=%s)"

          if [[ "$subject" != "Release $release_tag" ]]; then
            echo "No $release_tag release marker on this deployment; skipping stable release publication."
            exit 0
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')"
            test "$tag_sha" = "$RELEASE_SHA"
            echo "$release_tag already exists at the certified production SHA."
            exit 0
          fi

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Notes $release_tag" \
            --notes "Notes v1.1 Trust & Capture is certified and shipped. Production deployment, static smoke, and live rich Share-to-Notes smoke passed for exact SHA $RELEASE_SHA. v1.1 adds server-enforced versioned sync CAS with bounded reconciliation, immutable content-addressed attachment generations, rich Share-to-Notes capture with exact-once local commit semantics, and adversarial hardening. Permanent gates include formatting, foundation/release contracts, lint, TypeScript, the complete unit suite, production build/performance budget, cross-browser compatibility, the complete Chromium release regression with retries disabled, focused P20 and P34 certification with retries disabled, PWA/offline certification, and the A8 account-consumer contract on the certified pre-merge head."

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_SHA"
          echo "Published Notes $release_tag at $RELEASE_SHA"
