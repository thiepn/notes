name: V3.3 apply and verify

on:
  push:
    branches:
      - v3-3-performance-bundle-reduction-work

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare V3.3 patch
        run: python scripts/v3-3-bootstrap.py

      - name: Apply V3.3
        run: python scripts/v3-3-apply.py

      - name: Align runtime-cache certification
        run: python scripts/v3-3-postapply.py

      - name: Format V3.3 files
        run: >-
          npx prettier --write
          package.json
          vite.config.ts
          scripts/prepare-ocr-assets.mjs
          scripts/check-performance-budget.mjs
          src/app/AppShell.tsx
          src/components/AppHeader.tsx
          src/features/notes/NotesWorkspace.tsx
          src/features/notes/TextNoteComposer.tsx
          src/features/notes/ChecklistComposer.tsx
          src/features/search/SearchWorkspace.tsx
          src/features/reminders/RemindersWorkspace.tsx
          src/styles.css
          src/styles/performance.css
          pwa-e2e/pwa.spec.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build and performance budget
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Commit V3.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            vite.config.ts \
            scripts/prepare-ocr-assets.mjs \
            scripts/check-performance-budget.mjs \
            src/app/AppShell.tsx \
            src/components/AppHeader.tsx \
            src/features/notes/NotesWorkspace.tsx \
            src/features/notes/TextNoteComposer.tsx \
            src/features/notes/ChecklistComposer.tsx \
            src/features/search/SearchWorkspace.tsx \
            src/features/reminders/RemindersWorkspace.tsx \
            src/styles.css \
            src/styles/performance.css \
            pwa-e2e/pwa.spec.ts
          git commit -m "Implement V3.3 performance and bundle reduction"
          git push
