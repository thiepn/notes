name: V3.9 hardening verifier

on:
  push:
    branches: [v3-9-scale-storage-architecture-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply V3.9
        run: |
          python scripts/v3-9-apply.py
          python scripts/v3-9-fix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format
        run: npm run format

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint.log

      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: v3-9-lint-diagnostics
          path: lint.log

      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: v3-9-typecheck-diagnostics
          path: typecheck.log

      - name: Stop on typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test 2>&1 | tee unit.log

      - name: Upload unit diagnostics
        if: steps.unit.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: v3-9-unit-diagnostics
          path: unit.log

      - name: Stop on unit failure
        if: steps.unit.outcome == 'failure'
        run: exit 1

      - name: Production build and performance gates
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: v3-9-build-diagnostics
          path: build.log

      - name: Stop on build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        id: e2e
        continue-on-error: true
        run: npm run e2e 2>&1 | tee e2e.log

      - name: Upload browser diagnostics
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: v3-9-browser-diagnostics
          path: |
            e2e.log
            test-results

      - name: Stop on browser failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Commit verified V3.9
        run: |
          git rm scripts/v3-9-apply.py scripts/v3-9-fix.py .github/workflows/v3-9-apply-and-verify.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement V3.9 scale storage and architecture hardening"
          git push
