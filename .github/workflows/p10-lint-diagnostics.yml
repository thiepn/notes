name: P10 Lint Diagnostics

on:
  push:
    branches: [p10-final-product-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: p10-final-product-release

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture lint diagnostics
        run: npm run lint > p10-lint-diagnostics.txt 2>&1 || true

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p10-lint-diagnostics.txt
          git commit -m "P10: record lint diagnostics"
          git push origin HEAD:p10-final-product-release
