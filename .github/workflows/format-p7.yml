name: Format P7

on:
  push:
    paths:
      - '.github/workflows/format-p7.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Format P7 files
        run: >-
          npx prettier --write
          e2e/checklists.spec.ts
          src/db/repositories/checklistsRepository.ts
          src/features/notes/ChecklistComposer.tsx
          src/features/notes/ChecklistEditorDialog.tsx
          src/features/notes/ChecklistEditorFields.tsx
          src/features/notes/checklistModel.ts
          src/features/notes/NoteCard.tsx
          src/features/notes/NoteEditorDialog.tsx
          src/features/notes/NotesWorkspace.tsx
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add e2e/checklists.spec.ts src/db/repositories/checklistsRepository.ts src/features/notes/ChecklistComposer.tsx src/features/notes/ChecklistEditorDialog.tsx src/features/notes/ChecklistEditorFields.tsx src/features/notes/checklistModel.ts src/features/notes/NoteCard.tsx src/features/notes/NoteEditorDialog.tsx src/features/notes/NotesWorkspace.tsx
          git commit -m "style: format P7 checklist engine"
          git push origin HEAD:main
