name: P1 formatting
on:
  push:
    branches: [feat/p1-foundation]
    paths: [.github/workflows/p1-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p1-foundation
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write e2e/p1-foundation.spec.ts scripts/check-foundation-contract.mjs
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/p1-foundation.spec.ts scripts/check-foundation-contract.mjs
          git diff --cached --quiet || git commit -m 'Format P1 foundation contract and compatibility tests'
          git push origin HEAD:feat/p1-foundation
