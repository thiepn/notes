name: P4 V5 contract patch

on:
  push:
    branches:
      - feat/p4-capture-checklists-everyday
    paths:
      - .github/workflows/p4-v5-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p4-capture-checklists-everyday
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Apply minimal mobile New contract
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('e2e/v5-redesign.spec.ts')
          text = path.read_text()
          old = """  await drawer.getByRole('button', { name: 'Hide navigation' }).click();
  await page.getByRole('button', { name: 'New note', exact: true }).click();
  const form = page.getByRole('form', { name: 'New note' });
"""
          new = """  await drawer.getByRole('button', { name: 'Hide navigation' }).click();
  await page.getByRole('button', { name: 'New note', exact: true }).click();
  const captureMenu = page.getByRole('dialog', { name: 'New', exact: true });
  await captureMenu.getByRole('button', { name: /^Text note/ }).click();
  const form = page.getByRole('form', { name: 'New note' });
"""
          assert text.count(old) == 1, 'Canonical mobile capture block not found exactly once.'
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write e2e/v5-redesign.spec.ts
      - name: Verify only intended V5 diff
        run: |
          git diff --check
          git diff -- e2e/v5-redesign.spec.ts
      - name: Commit minimal contract update
        run: |
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git add e2e/v5-redesign.spec.ts
          git commit -m "Update V5 mobile capture contract for P4 universal New"
          git push origin HEAD:feat/p4-capture-checklists-everyday
