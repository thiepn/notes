name: V2-8 Clean Transplant

on:
  push:
    branches: [v2-8-clean-48ac]

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-main candidate
        uses: actions/checkout@v6
        with:
          ref: v2-8-clean-48ac
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Transplant and verify privacy feature
        run: bash scripts/v2-8-clean-transplant.sh

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Privacy browser certification
        run: npx playwright test e2e/privacy.spec.ts --retries=0
