name: P4 integrated implementation

on:
  push:
    branches:
      - feat/p4-capture-checklists-everyday
    paths:
      - .github/workflows/p4-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p4-capture-checklists-everyday
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Prepare P4 source
        run: python3 tools/apply_p4_all.py
      - name: Format P4 source
        run: npx prettier --write src e2e docs
      - name: Verify P4 source
        run: npm run foundation:check && npm run lint && npm run typecheck && npm test && npm run build
      - name: Commit P4 source
        run: |
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git add src e2e docs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Implement P4 capture, checklist and everyday operations"
            git push origin HEAD:feat/p4-capture-checklists-everyday
          fi
