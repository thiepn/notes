name: V3-4 Editor Interaction Preflight

on:
  push:
    branches: [v3-4-editor-interaction-polish]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-4-editor-interaction-polish

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply V3.4 editor integration
        run: python scripts/v3-4-editor-patch.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format V3.4 files
        run: |
          npx prettier --write src/features/notes/NoteEditorDialog.tsx src/features/notes/ChecklistEditorDialog.tsx src/features/notes/useExistingNoteEditor.ts src/features/notes/EditorStatusBar.tsx src/features/notes/editorInsights.ts src/features/notes/editorInsights.test.ts src/styles/editor-interaction-polish.css src/styles.css e2e/editor-interaction-polish.spec.ts
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/notes/NoteEditorDialog.tsx src/features/notes/ChecklistEditorDialog.tsx src/features/notes/useExistingNoteEditor.ts src/features/notes/EditorStatusBar.tsx src/features/notes/editorInsights.ts src/features/notes/editorInsights.test.ts src/styles/editor-interaction-polish.css src/styles.css e2e/editor-interaction-polish.spec.ts
            git commit -m "V3.4: integrate editor interaction polish"
            git push origin HEAD:v3-4-editor-interaction-polish
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: V3.4 browser certification
        run: npx playwright test e2e/editor-interaction-polish.spec.ts --retries=0
