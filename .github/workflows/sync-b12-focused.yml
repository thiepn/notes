name: B12 Source and Browser
on:
  pull_request:
    paths:
      - 'src/features/sync/**'
      - 'e2e/b12-ecosystem-dashboard.spec.ts'
      - '.github/workflows/sync-b12-focused.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.head_ref == 'feat/sync-b12-notes-dashboard-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format inherited B10-B11 drafts before focused verification
        run: |
          npx prettier --write docs/SYNC_B10_NOTES_CONSENT.md docs/SYNC_B11_NOTES.md src/features/sync/coreAdapter.lifecycle.test.ts src/features/sync/coreConsent.test.ts src/features/sync/coreConsent.ts
          node -e 'const fs=require("node:fs");for(const p of ["docs/SYNC_B10_NOTES_CONSENT.md","docs/SYNC_B11_NOTES.md","src/features/sync/coreAdapter.lifecycle.test.ts","src/features/sync/coreConsent.test.ts","src/features/sync/coreConsent.ts"])console.log("NOTES_B11_FMT="+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))'
      - name: Focused Notes original source checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Actual isolated Chromium acceptance
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/b12-ecosystem-dashboard.spec.ts --project=chromium
