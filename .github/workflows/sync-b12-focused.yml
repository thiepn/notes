name: B14 Native Consent and Recovery
on:
  pull_request:
    paths:
      - 'src/features/sync/**'
      - 'e2e/b12-ecosystem-dashboard.spec.ts'
      - 'e2e/b13-notes-native-handoff.spec.ts'
      - 'e2e/b14-notes-revoke.spec.ts'
      - '.github/workflows/sync-b12-focused.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.head_ref == 'feat/sync-b14-notes-recovery-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused Notes original source checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/features/sync/coreConsent.exit.test.ts
      - name: Actual isolated Chromium acceptance
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/b12-ecosystem-dashboard.spec.ts e2e/b13-notes-native-handoff.spec.ts e2e/b14-notes-revoke.spec.ts --project=chromium
