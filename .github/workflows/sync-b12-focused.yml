name: B15 Native Owner Recovery
on:
  pull_request:
    paths:
      - 'src/features/sync/**'
      - 'e2e/b12-ecosystem-dashboard.spec.ts'
      - 'e2e/b13-notes-native-handoff.spec.ts'
      - 'e2e/b14-notes-revoke.spec.ts'
      - 'e2e/b15-notes-recovery.spec.ts'
      - '.github/workflows/sync-b12-focused.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.head_ref == 'feat/sync-b15-notes-recovery-center'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B15 temporary exact-source formatting capture
        run: |
          npx prettier --write e2e/b15-notes-recovery.spec.ts src/features/sync/recoveryPresentation.test.ts src/features/sync/recoveryPresentation.ts src/features/sync/SyncSettings.tsx docs/SYNC_B15_NOTES.md
          node -e 'const fs=require("node:fs");for(const p of ["e2e/b15-notes-recovery.spec.ts","src/features/sync/recoveryPresentation.test.ts","src/features/sync/recoveryPresentation.ts","src/features/sync/SyncSettings.tsx","docs/SYNC_B15_NOTES.md"])console.log("B15_NOTES_FMT="+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))'
      - name: Focused Notes original source checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run src/features/sync/coreConsent.exit.test.ts src/features/sync/recoveryPresentation.test.ts
      - name: Actual isolated Chromium acceptance
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/b12-ecosystem-dashboard.spec.ts e2e/b13-notes-native-handoff.spec.ts e2e/b14-notes-revoke.spec.ts e2e/b15-notes-recovery.spec.ts --project=chromium
