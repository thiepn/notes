name: B13 Native Source and Browser
on:
  pull_request:
    paths:
      - 'src/features/sync/**'
      - 'e2e/b12-ecosystem-dashboard.spec.ts'
      - 'e2e/b13-notes-native-handoff.spec.ts'
      - '.github/workflows/sync-b12-focused.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.head_ref == 'feat/sync-b13-notes-native-recovery-consent'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: B13 temporary native Notes formatting capture
        run: |
          npx prettier --write e2e/b13-notes-native-handoff.spec.ts src/features/sync/coreConsent.revision.test.ts src/features/sync/coreConsent.ts
          node -e 'const fs=require("node:fs");for(const p of ["e2e/b13-notes-native-handoff.spec.ts","src/features/sync/coreConsent.revision.test.ts","src/features/sync/coreConsent.ts"])console.log("B13_NOTES_FMT="+JSON.stringify({path:p,content:fs.readFileSync(p,"utf8")}))'
      - name: Focused Notes original source checks
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Actual isolated Chromium acceptance
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/b12-ecosystem-dashboard.spec.ts e2e/b13-notes-native-handoff.spec.ts --project=chromium
