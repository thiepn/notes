name: Fix P12 Types

on:
  push:
    paths:
      - '.github/workflows/p12-fix-types.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Fix Blob, WebCrypto, and Dexie transaction typing
        run: |
          python - <<'PY'
          from pathlib import Path

          fmt = Path('src/features/backup/backupFormat.ts')
          text = fmt.read_text()
          old = """        data: new Blob([bytes], { type: attachment.mimeType }),\n"""
          new = """        data: new Blob([ownedArrayBuffer(bytes)], { type: attachment.mimeType }),\n"""
          if text.count(old) != 1:
              raise SystemExit('Blob anchor not found')
          text = text.replace(old, new, 1)

          old = """export async function sha256Hex(bytes: Uint8Array): Promise<string> {\n  const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);\n  const digest = await crypto.subtle.digest('SHA-256', buffer);\n  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');\n}\n"""
          new = """export async function sha256Hex(bytes: Uint8Array): Promise<string> {\n  const digest = await crypto.subtle.digest('SHA-256', ownedArrayBuffer(bytes));\n  return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, '0')).join('');\n}\n\nfunction ownedArrayBuffer(bytes: Uint8Array): ArrayBuffer {\n  return Uint8Array.from(bytes).buffer;\n}\n"""
          if text.count(old) != 1:
              raise SystemExit('SHA anchor not found')
          fmt.write_text(text.replace(old, new, 1))

          repo = Path('src/features/backup/backupRepository.ts')
          text = repo.read_text()
          old = """    const snapshot = await this.database.transaction(\n      'r',\n      this.database.notes,\n      this.database.checklistItems,\n      this.database.labels,\n      this.database.noteLabels,\n      this.database.attachments,\n      this.database.revisions,\n      this.database.settings,\n      async () => {\n"""
          new = """    const snapshot = await this.database.transaction(\n      'r',\n      [\n        this.database.notes,\n        this.database.checklistItems,\n        this.database.labels,\n        this.database.noteLabels,\n        this.database.attachments,\n        this.database.revisions,\n        this.database.settings,\n      ],\n      async () => {\n"""
          if text.count(old) != 1:
              raise SystemExit('Read transaction anchor not found')
          text = text.replace(old, new, 1)

          old = """    await this.database.transaction(\n      'rw',\n      this.database.notes,\n      this.database.checklistItems,\n      this.database.labels,\n      this.database.noteLabels,\n      this.database.attachments,\n      this.database.revisions,\n      this.database.settings,\n      async () => {\n"""
          new = """    await this.database.transaction(\n      'rw',\n      [\n        this.database.notes,\n        this.database.checklistItems,\n        this.database.labels,\n        this.database.noteLabels,\n        this.database.attachments,\n        this.database.revisions,\n        this.database.settings,\n      ],\n      async () => {\n"""
          if text.count(old) != 1:
              raise SystemExit('Write transaction anchor not found')
          repo.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/features/backup/backupFormat.ts src/features/backup/backupRepository.ts
      - name: Commit type fixes
        run: |
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add src/features/backup/backupFormat.ts src/features/backup/backupRepository.ts
          git commit -m "fix: satisfy P12 strict backup boundaries"
          git push origin HEAD:main
