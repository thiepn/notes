name: Format P10

on:
  push:
    paths:
      - '.github/workflows/format-p10.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Format P10 files
        run: >-
          npx prettier --write
          e2e/commands.spec.ts
          src/app/AppShell.tsx
          src/features/commands/CommandPalette.tsx
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add e2e/commands.spec.ts src/app/AppShell.tsx src/features/commands/CommandPalette.tsx
          git commit -m "style: format P10 command system"
          git push origin HEAD:main
