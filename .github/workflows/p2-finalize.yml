name: P2 shell final integration
on:
  push:
    branches: [feat/p2-shell-responsive-ux]
    paths: [.github/workflows/p2-finalize.yml]
permissions:
  contents: write
concurrency:
  group: notes-p2-shell-final
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p2-shell-responsive-ux
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Integrate responsive shell and code-split note workspace
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(); actual=text.count(old)
              assert actual==count, f'{path}: expected {count}, found {actual}: {old[:120]!r}'
              p.write_text(text.replace(old,new))

          replace('src/components/AppHeader.tsx',
            '          label="Toggle navigation"\n          tooltip="Toggle navigation"',
            '          className="header-navigation-action"\n          label="Toggle navigation"\n          tooltip="Toggle navigation"')
          replace('src/components/AppHeader.tsx',
            '<button\n            className="search-inline-action"\n            type="button"\n            aria-label={currentIsSaved ? \'Search saved\' : \'Save search\'}',
            '<button\n            className="search-inline-action search-save-action"\n            type="button"\n            aria-label={currentIsSaved ? \'Search saved\' : \'Save search\'}')
          replace('src/components/AppHeader.tsx',
            '<IconButton label="Open command palette" onClick={onCommandPalette}>',
            '<IconButton className="header-command-action" label="Open command palette" onClick={onCommandPalette}>')
          replace('src/components/AppHeader.tsx',
            '<IconButton label="Open settings" onClick={onSettings}>',
            '<IconButton className="header-settings-action" label="Open settings" onClick={onSettings}>')
          replace('src/components/AppHeader.tsx',
            '          ref={moreButtonRef}\n          label="More options"',
            '          ref={moreButtonRef}\n          className="header-more-action"\n          label="More options"')

          p=Path('src/app/AppShell.tsx'); text=p.read_text()
          text=text.replace(
            "import { subscribeAppEvent } from './events';",
            "import { subscribeAppEvent } from './events';\nimport {\n  readDesktopSidebarPreference,\n  resolveShellViewport,\n  writeDesktopSidebarPreference,\n  type DesktopSidebarPreference,\n  type ShellViewport,\n} from './shellLayout';",
          )
          text=text.replace("const MOBILE_QUERY = '(max-width: 767px)';\n", '')
          text=text.replace(
            "import { NotesWorkspace, type CaptureRequest } from '../features/notes/NotesWorkspace';",
            "import type { CaptureRequest } from '../features/notes/NotesWorkspace';",
          )
          lazy_anchor="const BackupWorkspace = lazy(() =>\n  import('../features/backup/BackupWorkspace').then((module) => ({\n    default: module.BackupWorkspace,\n  })),\n);"
          assert lazy_anchor in text
          text=text.replace(lazy_anchor, lazy_anchor+"\nconst NotesWorkspace = lazy(() =>\n  import('../features/notes/NotesWorkspace').then((module) => ({\n    default: module.NotesWorkspace,\n  })),\n);")
          text=text.replace(
            "  const [sidebarCompact, setSidebarCompact] = useState(false);\n  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);",
            "  const [desktopSidebarPreference, setDesktopSidebarPreference] =\n    useState<DesktopSidebarPreference>(() => readDesktopSidebarPreference());\n  const [tabletSidebarExpanded, setTabletSidebarExpanded] = useState(false);\n  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);",
          )
          text=text.replace(
            "  const [isMobile, setIsMobile] = useState(() =>\n    typeof window === 'undefined' ? false : window.matchMedia(MOBILE_QUERY).matches,\n  );\n\n  const searchFiltersActive",
            "  const [viewportMode, setViewportMode] = useState<ShellViewport>(() =>\n    typeof window === 'undefined' ? 'desktop' : resolveShellViewport(window.innerWidth),\n  );\n  const isMobile = viewportMode === 'mobile';\n  const isTablet = viewportMode === 'tablet';\n  const sidebarCompact = isMobile\n    ? false\n    : isTablet\n      ? !tabletSidebarExpanded\n      : desktopSidebarPreference === 'compact';\n\n  const searchFiltersActive",
          )
          start=text.index("  useEffect(() => {\n    const mediaQuery = window.matchMedia(MOBILE_QUERY);")
          end=text.index("\n  const handleNavigate = useCallback(", start)
          text=text[:start]+'''  useEffect(() => {\n    const handleResize = () => {\n      const nextMode = resolveShellViewport(window.innerWidth);\n      setViewportMode(nextMode);\n      if (nextMode !== 'mobile') setMobileSidebarOpen(false);\n      if (nextMode !== 'tablet') setTabletSidebarExpanded(false);\n    };\n\n    window.addEventListener('resize', handleResize, { passive: true });\n    return () => window.removeEventListener('resize', handleResize);\n  }, []);\n\n  useEffect(() => {\n    if (!mobileSidebarOpen && !tabletSidebarExpanded) return;\n\n    const handleKeyDown = (event: KeyboardEvent) => {\n      if (event.key !== 'Escape') return;\n      if (isMobile) setMobileSidebarOpen(false);\n      if (isTablet) setTabletSidebarExpanded(false);\n    };\n\n    window.addEventListener('keydown', handleKeyDown);\n    return () => window.removeEventListener('keydown', handleKeyDown);\n  }, [isMobile, isTablet, mobileSidebarOpen, tabletSidebarExpanded]);\n\n  const handleMenu = () => {\n    if (isMobile) {\n      setMobileSidebarOpen((open) => !open);\n      return;\n    }\n    if (isTablet) {\n      setTabletSidebarExpanded((expanded) => !expanded);\n      return;\n    }\n\n    setDesktopSidebarPreference((current) => {\n      const next = current === 'expanded' ? 'compact' : 'expanded';\n      writeDesktopSidebarPreference(next);\n      return next;\n    });\n  };\n'''+text[end:]
          text=text.replace(
            "      if (isMobile) setMobileSidebarOpen(false);\n    },\n    [clearSearch, isMobile],\n  );",
            "      setMobileSidebarOpen(false);\n      setTabletSidebarExpanded(false);\n    },\n    [clearSearch],\n  );",
            2,
          )
          text=text.replace(
            "      persistActiveSection('notes');\n      persistActiveLabelId(null);\n      captureRequestIdRef.current += 1;",
            "      persistActiveSection('notes');\n      persistActiveLabelId(null);\n      setMobileSidebarOpen(false);\n      setTabletSidebarExpanded(false);\n      captureRequestIdRef.current += 1;",
          )
          text=text.replace(
            "  const focusSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFocusRequest((request) => request + 1);\n  }, []);",
            "  const focusSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFocusRequest((request) => request + 1);\n  }, []);\n\n  const openSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFiltersOpen(true);\n    setSearchFocusRequest((request) => request + 1);\n    setMobileSidebarOpen(false);\n    setTabletSidebarExpanded(false);\n  }, []);",
          )
          text=text.replace('<div className="app-shell">', '<div\n      className="app-shell"\n      data-viewport={viewportMode}\n      data-sidebar={sidebarCompact ? \'compact\' : \'expanded\'}\n    >')
          text=text.replace('navigationOpen={isMobile ? mobileSidebarOpen : !sidebarCompact}', "navigationOpen={\n          isMobile\n            ? mobileSidebarOpen\n            : isTablet\n              ? tabletSidebarExpanded\n              : desktopSidebarPreference === 'expanded'\n        }")
          text=text.replace('          activeLabelId={activeLabel?.id ?? null}\n          labels={labels}', '          activeLabelId={activeLabel?.id ?? null}\n          searchActive={searchActive}\n          labels={labels}')
          text=text.replace('          mobileOpen={mobileSidebarOpen}\n          mobile={isMobile}\n          onNavigate={handleNavigate}', '          mobileOpen={mobileSidebarOpen}\n          mobile={isMobile}\n          tablet={isTablet}\n          onNavigate={handleNavigate}\n          onSearch={openSearch}')
          text=text.replace(
            "          onCommands={() => {\n            setMobileSidebarOpen(false);\n            setCommandPaletteOpen(true);\n          }}\n          onCloseNavigation",
            "          onCommands={() => {\n            setMobileSidebarOpen(false);\n            setTabletSidebarExpanded(false);\n            setCommandPaletteOpen(true);\n          }}\n          onSettings={() => {\n            setMobileSidebarOpen(false);\n            setTabletSidebarExpanded(false);\n            setSettingsInitialSection('appearance');\n            setSettingsOpen(true);\n          }}\n          onCloseNavigation",
          )
          text=text.replace('<button type="button" aria-label="Find a note" onClick={focusSearch}>', '<button\n          type="button"\n          aria-label="Find a note"\n          aria-current={searchActive ? \'page\' : undefined}\n          onClick={openSearch}\n        >')
          old_workspace='''            ) : lifecycleSection ? (\n              <NotesWorkspace\n                mode={activeLabel ? 'notes' : activeSection}\n                labels={labels}\n                filterLabelId={activeLabel?.id ?? null}\n                viewMode={viewMode}\n                onViewModeChange={handleViewMode}\n                captureRequest={captureRequest}\n                onCaptureRequestHandled={(requestId) =>\n                  setCaptureRequest((current) => (current?.id === requestId ? null : current))\n                }\n                onCollectionChanged={handleCollectionChanged}\n              />\n            ) : ('''
          new_workspace='''            ) : lifecycleSection ? (\n              <Suspense fallback={<DeferredWorkspaceFallback label="Loading notes…" />}>\n                <NotesWorkspace\n                  mode={activeLabel ? 'notes' : activeSection}\n                  labels={labels}\n                  filterLabelId={activeLabel?.id ?? null}\n                  viewMode={viewMode}\n                  onViewModeChange={handleViewMode}\n                  captureRequest={captureRequest}\n                  onCaptureRequestHandled={(requestId) =>\n                    setCaptureRequest((current) => (current?.id === requestId ? null : current))\n                  }\n                  onCollectionChanged={handleCollectionChanged}\n                />\n              </Suspense>\n            ) : ('''
          assert old_workspace in text
          text=text.replace(old_workspace,new_workspace)
          p.write_text(text)

          replace('e2e/shell.spec.ts',
            "  await page.getByTestId('navigation-toggle').click();\n  await expect(sidebar).toHaveAttribute('data-open', 'true');\n  await expect(sidebar).toBeVisible();\n\n  await page.getByRole('button', { name: 'Close navigation' }).click();",
            "  await page.getByRole('button', { name: 'Open navigation' }).click();\n  await expect(sidebar).toHaveAttribute('data-open', 'true');\n  await expect(sidebar).toBeVisible();\n\n  await sidebar.getByRole('button', { name: 'Hide navigation' }).click();")

          architecture=Path('docs/ARCHITECTURE.md'); current=architecture.read_text()
          if '## P2 shell and responsive boundary' not in current:
            architecture.write_text(current+'''\n\n## P2 shell and responsive boundary\n\nResponsive shell state is owned by `AppShell` and normalized through `src/app/shellLayout.ts`. The three supported modes are mobile (<=767px), tablet (768–1100px), and desktop (>=1101px). Only the desktop expanded/compact preference persists. Tablet expansion and the mobile drawer are transient UI state and may never leak into durable note data or cloud synchronization.\n\nThe sidebar remains a rendering boundary: it receives active destination, counts, responsive density, and action callbacks. It does not query viewport state or mutate navigation persistence itself. This keeps later editor routing and split-pane work independent from the shell's responsive mechanics.\n''')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/app/AppShell.tsx src/app/shellLayout.ts src/app/shellLayout.test.ts src/components/AppHeader.tsx src/components/AppSidebar.tsx src/styles/shell.css e2e/shell.spec.ts e2e/p2-shell-responsive.spec.ts docs/SHELL_RESPONSIVE.md docs/ARCHITECTURE.md
      - run: npm run foundation:check && npm run lint && npm run typecheck && npm test && npm run build
      - name: Commit verified P2 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src e2e docs
          git diff --cached --quiet || git commit -m 'P2: responsive shell, navigation modes and startup code split'
          git push origin HEAD:feat/p2-shell-responsive-ux
      - run: npx playwright install --with-deps chromium
      - name: Targeted shell certification without retries
        run: npx playwright test e2e/p2-shell-responsive.spec.ts e2e/shell.spec.ts e2e/p1-foundation.spec.ts --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-p2-final-evidence
          path: test-results
          retention-days: 7
