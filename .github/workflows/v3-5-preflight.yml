name: V3-5 Reminder Time Preflight

on:
  push:
    branches: [v3-5-reminders-time-polish]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-5-reminders-time-polish

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Integrate and format V3.5
        run: bash scripts/v3-5-preflight.sh

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Reminder regression suite
        run: npx playwright test e2e/reminders-time-polish.spec.ts e2e/reminders.spec.ts e2e/reminders-mobile.spec.ts e2e/reminder-timezone.spec.ts --retries=0
