name: Fix P12 Navigation

on:
  push:
    paths:
      - '.github/workflows/p12-fix-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Fix active section reader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/AppShell.tsx')
          text = path.read_text()
          old = """    const stored = window.localStorage.getItem(ACTIVE_SECTION_KEY);\n    return;\n    stored === 'reminders' || stored === 'archive' || stored === 'trash' || stored === 'backup'\n      ? stored\n      : 'notes';\n"""
          new = """    const stored = window.localStorage.getItem(ACTIVE_SECTION_KEY);\n    return stored === 'reminders' ||\n      stored === 'archive' ||\n      stored === 'trash' ||\n      stored === 'backup'\n      ? stored\n      : 'notes';\n"""
          if text.count(old) != 1:
              raise SystemExit('Active section reader anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/app/AppShell.tsx
      - name: Commit navigation fix
        run: |
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add src/app/AppShell.tsx
          git commit -m "fix: persist P12 backup navigation"
          git push origin HEAD:main
