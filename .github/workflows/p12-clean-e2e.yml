name: Clean P12 E2E

on:
  push:
    paths:
      - '.github/workflows/p12-clean-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Clean test harness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/backup.spec.ts')
          text = path.read_text()
          helper = """async function openBackup(page: Page) {\n  await page.goto('./');\n  await waitForNotes(page);\n  await page.getByRole('button', { name: 'Backup' }).click();\n  await expect(page.getByRole('heading', { name: 'Backup', level: 1 })).toBeVisible();\n  await expect(page.getByRole('heading', { name: 'Back up this device' })).toBeVisible();\n}\n\n"""
          if text.count(helper) != 1:
              raise SystemExit('Unused helper anchor not found')
          text = text.replace(helper, '', 1)
          old = "    const raw = JSON.parse(exported.json) as backupFormat.BackupDocument;\n"
          new = "    const raw = JSON.parse(exported.json);\n"
          if text.count(old) != 1:
              raise SystemExit('Dynamic import type assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write e2e/backup.spec.ts
      - name: Commit harness cleanup
        run: |
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add e2e/backup.spec.ts
          git commit -m "test: clean P12 backup harness"
          git push origin HEAD:main
