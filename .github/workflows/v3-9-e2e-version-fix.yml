name: V3.9 E2E version fix

on:
  push:
    branches: [v3-9-scale-storage-architecture-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply E2E version fixes
        run: python scripts/v3-9-e2e-version-fix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify version-sensitive E2E tests
        run: npx playwright test e2e/backup-recovery-polish.spec.ts e2e/database.spec.ts

      - name: Commit verified E2E fixes
        run: |
          git rm scripts/v3-9-e2e-version-fix.py .github/workflows/v3-9-e2e-version-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update V3.9 database version E2E contracts"
          git push
