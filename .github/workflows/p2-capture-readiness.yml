name: P2 capture readiness diagnostic
on:
  push:
    branches: [diag/p2-capture-readiness]
    paths: [.github/workflows/p2-capture-readiness.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Patch capture test with hydration readiness and diagnostics
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('e2e/capture-mobile-polish.spec.ts')
          s=p.read_text()
          old="""    const trigger = page.getByRole('button', { name: 'Create a text note' });\n    await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));\n    await expect(trigger).toBeVisible();\n"""
          new="""    const trigger = page.getByRole('button', { name: 'Create a text note' });\n    console.log('BEFORE_HYDRATION', await page.evaluate(() => ({ scrollY, bodyHeight: document.body.scrollHeight, rootHeight: document.documentElement.scrollHeight, cards: document.querySelectorAll('[data-note-card]').length })));\n    await expect(page.locator('[data-note-card]')).toHaveCount(18);\n    console.log('AFTER_HYDRATION', await page.evaluate(() => ({ scrollY, bodyHeight: document.body.scrollHeight, rootHeight: document.documentElement.scrollHeight, cards: document.querySelectorAll('[data-note-card]').length })));\n    await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));\n    console.log('AFTER_SCROLL', await page.evaluate(() => ({ scrollY, bodyHeight: document.body.scrollHeight, rootHeight: document.documentElement.scrollHeight, cards: document.querySelectorAll('[data-note-card]').length })));\n    await expect(trigger).toBeVisible();\n"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - run: npx playwright test e2e/capture-mobile-polish.spec.ts --grep "capture stays reachable" --retries=0 --reporter=line
