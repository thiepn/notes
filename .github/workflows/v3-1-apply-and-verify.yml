name: V3.1 apply and verify

on:
  push:
    branches:
      - v3-1-capture-mobile-polish

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply V3.1
        run: python scripts/v3-1-apply.py

      - name: Format V3.1 files
        run: >-
          npx prettier --write
          src/features/notes/TextNoteComposer.tsx
          src/features/notes/NoteEditorDialog.tsx
          src/features/notes/ChecklistEditorFields.tsx
          src/features/richText/RichTextEditor.tsx
          src/styles.css
          src/styles/capture-mobile-polish.css
          e2e/capture-mobile-polish.spec.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Commit V3.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/notes/TextNoteComposer.tsx \
            src/features/notes/NoteEditorDialog.tsx \
            src/features/notes/ChecklistEditorFields.tsx \
            src/features/richText/RichTextEditor.tsx \
            src/styles.css \
            src/styles/capture-mobile-polish.css \
            e2e/capture-mobile-polish.spec.ts
          git commit -m "Implement V3.1 capture and mobile UX polish"
          git push