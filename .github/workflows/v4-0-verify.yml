name: V4.0 large-library verifier

on:
  push:
    branches: [v4-0-large-library-engine]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Apply V4.0
        run: |
          python scripts/v4-0-apply.py
          python scripts/v4-0-fix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format V4.0 source
        run: >-
          npx prettier --write
          src/features/search/search.worker.ts
          src/features/search/searchWorkerClient.ts
          src/features/search/searchRepository.ts
          src/features/search/SearchWorkspace.tsx
          src/features/notes/MasonryGrid.tsx
          src/styles/notes.css
          scripts/check-performance-budget.mjs
          e2e/large-library-engine.spec.ts
          docs/LARGE_LIBRARY_ENGINE.md
          docs/ARCHITECTURE.md
          docs/PRODUCT.md

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build and performance gates
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: V4.0 focused browser regression
        run: npx playwright test e2e/large-library-engine.spec.ts e2e/search.spec.ts e2e/database.spec.ts

      - name: Full browser regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Commit verified V4.0
        run: |
          git rm scripts/v4-0-apply.py scripts/v4-0-fix.py .github/workflows/v4-0-verify.yml
          git add \
            src/features/search/search.worker.ts \
            src/features/search/searchWorkerClient.ts \
            src/features/search/searchRepository.ts \
            src/features/search/SearchWorkspace.tsx \
            src/features/notes/MasonryGrid.tsx \
            src/styles/notes.css \
            scripts/check-performance-budget.mjs \
            e2e/large-library-engine.spec.ts \
            docs/LARGE_LIBRARY_ENGINE.md \
            docs/ARCHITECTURE.md \
            docs/PRODUCT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement V4.0 large-library engine and responsiveness"
          git push
