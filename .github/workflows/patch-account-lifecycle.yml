name: Patch account lifecycle UX

on:
  push:
    branches: [feat/supabase-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/supabase-sync
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Patch account lifecycle UX
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path_str}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          replace(
              'src/features/sync/supabaseApi.ts',
              "export interface SupabaseUser {\n  id: string;\n  email?: string;\n}",
              "export interface SupabaseUser {\n  id: string;\n  email?: string;\n  new_email?: string;\n}",
          )

          replace(
              'src/features/sync/SyncProvider.tsx',
              "  const [pendingEmail, setPendingEmail] = useState<string | null>(null);",
              "  const [pendingEmail, setPendingEmail] = useState<string | null>(\n    () => session?.user.new_email ?? null,\n  );",
          )
          replace(
              'src/features/sync/SyncProvider.tsx',
              "  const updateSession = useCallback((next: SupabaseSession | null) => {\n    setSession(next);\n    storeSession(next);\n  }, []);",
              "  const updateSession = useCallback((next: SupabaseSession | null) => {\n    setSession(next);\n    setPendingEmail(next?.user.new_email ?? null);\n    storeSession(next);\n  }, []);",
          )
          replace(
              'src/features/sync/SyncProvider.tsx',
              "      setPendingEmail(email.trim());\n      setMessage('Email change requested. Follow the confirmation link sent by Supabase.');",
              "      setPendingEmail(user.new_email ?? email.trim());\n      setMessage('Email change requested. Follow the confirmation link sent by Supabase.');",
          )
          replace(
              'src/features/sync/SyncProvider.tsx',
              "          } else if (callback.type === 'signup') {\n            setMessage('Email address confirmed.');\n          }\n          return;",
              "          } else if (callback.type === 'signup') {\n            setMessage('Email address confirmed.');\n          }\n          window.dispatchEvent(new CustomEvent('notes-open-sync-settings'));\n          return;",
          )

          app = Path('src/app/AppShell.tsx')
          text = app.read_text()
          import_anchor = "import { LabelManagerDialog } from '../features/notes/LabelManagerDialog';\n"
          if "import type { SettingsSection }" not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + "import type { SettingsSection } from '../features/settings/SettingsDialog';\n",
                  1,
              )
          text = text.replace(
              "  const [settingsOpen, setSettingsOpen] = useState(false);",
              "  const [settingsOpen, setSettingsOpen] = useState(false);\n  const [settingsInitialSection, setSettingsInitialSection] =\n    useState<SettingsSection>('appearance');",
              1,
          )
          event_anchor = "  useEffect(() => {\n    const mediaQuery = window.matchMedia(MOBILE_QUERY);"
          event_effect = """  useEffect(() => {\n    const openSyncSettings = () => {\n      setSettingsInitialSection('sync');\n      setSettingsOpen(true);\n    };\n    window.addEventListener('notes-open-sync-settings', openSyncSettings);\n    return () => window.removeEventListener('notes-open-sync-settings', openSyncSettings);\n  }, []);\n\n"""
          if "notes-open-sync-settings" not in text:
              text = text.replace(event_anchor, event_effect + event_anchor, 1)
          text = text.replace(
              "        onSettings={() => setSettingsOpen(true)}",
              "        onSettings={() => {\n          setSettingsInitialSection('appearance');\n          setSettingsOpen(true);\n        }}",
              1,
          )
          text = text.replace(
              "        <Suspense fallback={<div className=\"deferred-settings-loading\">Loading settings…</div>}>\n          <SettingsDialog",
              "        <Suspense fallback={<div className=\"deferred-settings-loading\">Loading settings…</div>}>\n          <SettingsDialog\n            initialSection={settingsInitialSection}",
              1,
          )
          text = text.replace(
              "              setPrivacyLockSettingsOpen(false);\n              setSettingsOpen(true);",
              "              setPrivacyLockSettingsOpen(false);\n              setSettingsInitialSection('privacy');\n              setSettingsOpen(true);",
              1,
          )
          # Command-palette Settings should always open at the normal Appearance section.
          text = text.replace(
              "        setCommandPaletteOpen(false);\n        setSettingsOpen(true);",
              "        setCommandPaletteOpen(false);\n        setSettingsInitialSection('appearance');\n        setSettingsOpen(true);",
              1,
          )
          app.write_text(text)
          PY
      - run: npx prettier --write src/features/sync/SupabaseApi.ts src/features/sync/SyncProvider.tsx src/app/AppShell.tsx || npx prettier --write src/features/sync/supabaseApi.ts src/features/sync/SyncProvider.tsx src/app/AppShell.tsx
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit lifecycle patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/sync/supabaseApi.ts src/features/sync/SyncProvider.tsx src/app/AppShell.tsx
          git commit -m "Complete account lifecycle navigation"
          git push origin HEAD:feat/supabase-sync
