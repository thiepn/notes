name: Temporary UI format fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed UI files
        run: >-
          npx prettier --write
          src/features/notes/ChecklistEditorDialog.tsx
          src/features/reminders/ReminderControl.tsx
          e2e/history.spec.ts
          e2e/voice.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/notes/ChecklistEditorDialog.tsx \
            src/features/reminders/ReminderControl.tsx \
            e2e/history.spec.ts \
            e2e/voice.spec.ts
          git commit -m "Format simplified Notes UI"
          git push
