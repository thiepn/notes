name: V2-8 Privacy Preflight

on:
  push:
    branches: [v2-8-privacy-enhancements]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v2-8-privacy-enhancements

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format release candidate
        run: |
          npx prettier --write README.md docs/PRIVACY.md src/App.tsx src/components/AppHeader.tsx src/features/privacy src/features/reminders/ReminderNotificationCoordinator.tsx src/features/notes/NoteCard.tsx src/styles/privacy.css src/styles.css e2e/privacy.spec.ts
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs/PRIVACY.md src/App.tsx src/components/AppHeader.tsx src/features/privacy src/features/reminders/ReminderNotificationCoordinator.tsx src/features/notes/NoteCard.tsx src/styles/privacy.css src/styles.css e2e/privacy.spec.ts
            git commit -m "V2-8: format privacy release candidate"
            git push origin HEAD:v2-8-privacy-enhancements
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
