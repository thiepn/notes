name: Notes V5 regression hardening
on:
  push:
    branches: [feat/notes-v5-editorial-overhaul]
    paths: [.github/workflows/v5-hardening.yml]
permissions:
  contents: write
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/notes-v5-editorial-overhaul
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Apply checksum-verified source changes
        env:
          PATCH: 
        run: |
          python3 <<'PY'
          import os,base64,zlib,json,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['PATCH'],validate=True))
          assert hashlib.sha256(data).hexdigest()=='0745ebbb9179244008398cbcfbc81348af666ca49b5808073611ea980f8322f3'
          root=Path.cwd(); changes=[]
          for x in json.loads(data):
              p=(root/x['p']).resolve()
              assert p.is_relative_to(root) and '.git' not in p.relative_to(root).parts
              before=p.read_bytes(); assert hashlib.sha256(before).hexdigest()==x['b'],x['p']
              lines=before.decode().splitlines(keepends=True)
              for i,j,s in reversed(x['e']): lines[i:j]=[s]
              after=''.join(lines).encode();assert hashlib.sha256(after).hexdigest()==x['a'],x['p']
              changes.append((p,after))
          for p,after in changes:p.write_bytes(after)
          print('Verified and applied',len(changes),'source changes')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src e2e playwright.pwa.config.ts .gitignore
          git commit -m 'Harden V5 mobile drawer targets, hidden inputs, focus lifecycle and regression contracts'
          git push origin HEAD:feat/notes-v5-editorial-overhaul
      - run: npx playwright install --with-deps chromium
      - name: Focused certification without retries
        run: npx playwright test e2e/v5-redesign.spec.ts e2e/v5-sync-integrity.spec.ts e2e/shell.spec.ts e2e/account-sync.spec.ts e2e/settings-consolidation.spec.ts e2e/organization-navigation-polish.spec.ts e2e/interaction-accessibility.spec.ts --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-v5-hardening-evidence
          path: test-results
          retention-days: 7
