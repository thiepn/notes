name: Notes V5 regression hardening
on:
  push:
    branches: [feat/notes-v5-editorial-overhaul]
    paths: [.github/workflows/v5-hardening.yml]
permissions:
  contents: write
concurrency:
  group: notes-v5-hardening
  cancel-in-progress: true
jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/notes-v5-editorial-overhaul
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Apply explicit regression repairs
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              assert text.count(old)==count, (path, old, text.count(old))
              p.write_text(text.replace(old,new))
          for text in ['Setup required', 'Synced', 'Password recovery']:
              old="page.getByText('"+text+"'"+("" if text=='Setup required' else ", { exact: true }")+")"
              new="page.locator('section[aria-label=\"Cloud sync\"]').getByText('"+text+"', { exact: true })"
              replace('e2e/account-sync.spec.ts',old,new)
          replace('e2e/settings-consolidation.spec.ts','advanced data tools leave permanent sidebar chrome and remain reachable from settings and commands','data tools remain reachable from the new sidebar shortcut, settings, and commands')
          replace('e2e/settings-consolidation.spec.ts',"await expect(sidebar.getByRole('button', { name: /Backup/u })).toHaveCount(0);","await sidebar.getByRole('button', { name: 'Backup & import', exact: true }).click();\n  await expect(page.getByRole('heading', { name: 'Backup', level: 1 })).toBeVisible();")
          p=Path('e2e/v5-redesign.spec.ts');p.write_text(p.read_text().replace('fullPage: true','fullPage: false'))
          replace('e2e/v5-redesign.spec.ts','      await noPageOverflow(page);\n      await page.screenshot({\n        path: testInfo.outputPath(`account-${theme}-${width}.png`)', '''      const lastAction = dialog.getByRole('button', { name: 'Resend verification', exact: true });
                await lastAction.scrollIntoViewIfNeeded();
                await expect(lastAction).toBeInViewport({ ratio: 1 });
                await expect(dialog.getByRole('button', { name: 'Close settings' })).toBeInViewport({ ratio: 1 });
                await noPageOverflow(page);
                await page.screenshot({
                  path: testInfo.outputPath(`account-${theme}-${width}.png`)''')
          replace('e2e/organization-navigation-polish.spec.ts',"  await alphaCard\n    .getByRole('button', { name: 'Archive note: Active Alpha' })\n    .click({ force: true });","  await alphaCard.hover();\n  await alphaCard.getByRole('button', { name: 'Archive note: Active Alpha' }).click();")
          replace('e2e/interaction-accessibility.spec.ts', "  const focusStyle = await search.evaluate((element) => {\n    const styles = getComputedStyle(element);\n    return { style: styles.outlineStyle, width: styles.outlineWidth };\n  });\n  expect(focusStyle.style).toBe('solid');\n  expect(focusStyle.width).toBe('2px');", "  await expect(search).toHaveCSS('outline-style', 'solid');\n  await expect(search).toHaveCSS('outline-width', '2px');")
          replace('e2e/shell.spec.ts',"async ({ page }) => {\n  for (const viewport of VIEWPORTS)","async ({ page }, testInfo) => {\n  for (const viewport of VIEWPORTS)")
          replace('e2e/shell.spec.ts','    expect(dimensions.body).toBeLessThanOrEqual(dimensions.viewport);', '''    if (dimensions.body > dimensions.viewport || dimensions.document > dimensions.viewport) {
                const overflow = await page.evaluate(() => Array.from(document.querySelectorAll('*')).flatMap((node) => {
                  const rect = node.getBoundingClientRect();
                  return rect.right > innerWidth + 0.1 && rect.width > 0 ? [{ tag: node.tagName, class: node.className, right: rect.right, width: rect.width, position: getComputedStyle(node).position }] : [];
                }));
                await testInfo.attach('overflow-diagnostics', { body: JSON.stringify({dimensions, overflow}), contentType: 'application/json' });
                console.log('Overflow diagnostics:', JSON.stringify({dimensions, overflow}));
              }
              expect(dimensions.body).toBeLessThanOrEqual(dimensions.viewport);''')
          replace('src/styles/attachments.css','.attachment-file-input {\n  position: absolute;','.attachment-file-input {\n  position: absolute;\n  top: 0;\n  left: 0;\n  padding: 0;\n  border: 0;')
          replace('src/styles/shell.css','--header-height: 112px;','--header-height: 112px;\n    --mobile-drawer-width: min(300px, calc(100vw - 48px));')
          replace('src/styles/shell.css','width: min(300px, calc(100vw - 36px));','width: var(--mobile-drawer-width);')
          replace('src/styles/shell.css','inset: var(--header-height) 0 0;','inset: var(--header-height) 0 0 var(--mobile-drawer-width);\n    padding: 0;')
          replace('src/components/ui/useDialogFocusTrap.ts','  const setupDialog = useEffectEvent(() => {', "  const handleEscape = useEffectEvent((event: KeyboardEvent) => {\n    if (!options.onEscape) return;\n    event.preventDefault();\n    event.stopPropagation();\n    options.onEscape();\n  });\n  const setupDialog = useEffectEvent(() => {")
          replace('src/components/ui/useDialogFocusTrap.ts',"if (event.key === 'Escape' && options.onEscape) {\n        event.preventDefault();\n        event.stopPropagation();\n        options.onEscape();", "if (event.key === 'Escape') {\n        handleEscape(event);")
          replace('playwright.pwa.config.ts',"  testDir: './pwa-e2e',","  testDir: './pwa-e2e',\n  outputDir: './pwa-test-results',")
          p=Path('.gitignore');p.write_text(p.read_text()+'\npwa-test-results/\n')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Format edited files
        run: npx prettier --write e2e/account-sync.spec.ts e2e/settings-consolidation.spec.ts e2e/v5-redesign.spec.ts e2e/organization-navigation-polish.spec.ts e2e/interaction-accessibility.spec.ts e2e/shell.spec.ts src/styles/attachments.css src/styles/shell.css src/components/ui/useDialogFocusTrap.ts playwright.pwa.config.ts
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src e2e playwright.pwa.config.ts .gitignore
          git commit -m 'Harden V5 mobile drawer targets, hidden inputs, focus lifecycle and regression contracts'
          git push origin HEAD:feat/notes-v5-editorial-overhaul
      - run: npx playwright install --with-deps chromium
      - name: Focused certification without retries
        run: npx playwright test e2e/v5-redesign.spec.ts e2e/v5-sync-integrity.spec.ts e2e/shell.spec.ts e2e/account-sync.spec.ts e2e/settings-consolidation.spec.ts e2e/organization-navigation-polish.spec.ts e2e/interaction-accessibility.spec.ts --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notes-v5-hardening-evidence
          path: test-results
          retention-days: 7
