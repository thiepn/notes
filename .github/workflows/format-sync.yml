name: Format sync branch

on:
  push:
    branches: [feat/supabase-sync]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/supabase-sync
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/App.tsx src/features/settings/SettingsDialog.tsx src/features/sync
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/settings/SettingsDialog.tsx src/features/sync
          git commit -m "Format Supabase sync implementation"
          git push origin HEAD:feat/supabase-sync
