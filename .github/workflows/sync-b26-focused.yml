name: B26 Notes Original Owner & Device Lifecycle
on:
  pull_request:
    paths:
      - 'src/features/sync/**'
      - 'src/features/backup/**'
      - 'e2e/b17-native-recovery.spec.ts'
      - '.github/workflows/sync-b26-focused.yml'
permissions:
  contents: read
jobs:
  focused:
    if: github.head_ref == 'feat/sync-b26-notes-session-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original Notes formatting lint and types
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Original Notes device continuity and recovery tests
        run: npx vitest run src/features/backup/handoffReconciliation.test.ts src/features/sync/nativeSyncPause.test.ts src/features/sync/handoffReadiness.test.ts src/features/backup/deviceHandoffInspection.test.ts src/features/sync/nativeDeviceSwitch.b21.test.ts src/features/sync/nativeDeviceSwitch.test.ts src/features/sync/deviceContinuity.b19.test.ts src/features/sync/deviceContinuity.test.ts src/features/sync/nativeRecoveryHandoff.test.ts
      - name: Capture exact formatter output on failure
        if: failure()
        run: |
          npx prettier --write src/features/sync/nativeSyncPause.ts src/features/sync/nativeSyncPause.test.ts src/app/AppShell.tsx src/features/backup/BackupWorkspace.tsx src/features/backup/handoffReconciliation.ts src/features/backup/handoffReconciliation.test.ts src/features/sync/handoffReadiness.ts src/features/sync/handoffReadiness.test.ts src/features/backup/deviceHandoffInspection.ts src/features/backup/deviceHandoffInspection.test.ts src/features/sync/nativeDeviceSwitch.ts src/features/sync/nativeDeviceSwitch.b21.test.ts src/features/sync/nativeDeviceSwitch.test.ts src/features/sync/SyncSettings.tsx e2e/b17-native-recovery.spec.ts
          node -e "const fs=require('fs');for(const path of ['docs/SYNC_B26_NOTES_LIFECYCLE.md','src/features/sync/nativeSyncPause.ts','src/features/sync/nativeSyncPause.test.ts','src/features/sync/SyncProvider.tsx','src/app/AppShell.tsx','src/features/backup/BackupWorkspace.tsx','src/features/backup/handoffReconciliation.ts','src/features/backup/handoffReconciliation.test.ts','src/features/sync/handoffReadiness.ts','src/features/sync/handoffReadiness.test.ts','src/features/backup/deviceHandoffInspection.ts','src/features/backup/deviceHandoffInspection.test.ts','src/features/sync/nativeDeviceSwitch.ts','src/features/sync/nativeDeviceSwitch.b21.test.ts','src/features/sync/nativeDeviceSwitch.test.ts','src/features/sync/SyncSettings.tsx','e2e/b17-native-recovery.spec.ts']){const s=fs.readFileSync(path,'utf8');for(let i=0;i<s.length;i+=700)console.log('B26_FORMATTED '+JSON.stringify({path,index:i,chunk:s.slice(i,i+700)}));}"
      - name: Original guest recovery Chromium continuity
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/b25-notes-handoff.spec.ts e2e/b17-native-recovery.spec.ts e2e/b15-notes-recovery.spec.ts --project=chromium
