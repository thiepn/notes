name: V3.3 integrate and verify

on:
  push:
    branches:
      - v3-3-performance-bundle-reduction-integrate

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main-based integration branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply verified V3.3 product commit
        run: |
          git fetch origin 4fd82e57215c64a023c6a29e18b5a64009e0baf9
          git cherry-pick 4fd82e57215c64a023c6a29e18b5a64009e0baf9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build and performance budget
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Push integrated V3.3
        run: git push
