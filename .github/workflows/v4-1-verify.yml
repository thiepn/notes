name: V4.1 visual system verifier

on:
  push:
    branches: [v4-1-visual-system-interaction-polish]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format V4.1 source
        run: >-
          npx prettier --write
          src/styles/tokens.css
          src/styles/visual-system-polish.css
          src/styles.css
          e2e/visual-system-polish.spec.ts
          docs/DESIGN_SYSTEM.md

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build and performance gates
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: V4.1 focused browser regression
        run: npx playwright test e2e/visual-system-polish.spec.ts e2e/responsive.spec.ts e2e/capture-mobile-polish.spec.ts e2e/selection.spec.ts

      - name: Full browser regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa

      - name: Commit verified V4.1
        run: |
          git rm .github/workflows/v4-1-verify.yml
          git add \
            src/styles/tokens.css \
            src/styles/visual-system-polish.css \
            src/styles.css \
            e2e/visual-system-polish.spec.ts \
            docs/DESIGN_SYSTEM.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize V4.1 visual system and interaction polish"
          git push
