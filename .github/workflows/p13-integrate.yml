name: Integrate P13 Keep Import

on:
  push:
    paths:
      - '.github/workflows/p13-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Apply P13 integration hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('src/features/import/googleKeepRepository.ts')
          text = repo.read_text()
          old = """    const itemIds = source.items.map(() => this.idFactory());\n    const items = source.items.map((item, index) =>\n      checklistItemRecordSchema.parse({\n        id: itemIds[index],\n        noteId,\n        text: item.text,\n        checked: item.checked,\n        parentId: item.parentIndex === null ? null : itemIds[item.parentIndex],\n        position: index,\n        createdAt: source.createdAt,\n        updatedAt: source.updatedAt,\n      }),\n    );\n"""
          new = """    const itemIds = source.items.map(() => this.idFactory());\n    const items = source.items.map((item, index) => {\n      const id = itemIds[index];\n      if (!id) throw new Error('Failed to allocate a checklist item ID during Keep import.');\n      let parentId: string | null = null;\n      if (item.parentIndex !== null) {\n        parentId = itemIds[item.parentIndex] ?? null;\n        if (!parentId) {\n          throw new Error('A Keep checklist item references a missing imported parent.');\n        }\n      }\n      return checklistItemRecordSchema.parse({\n        id,\n        noteId,\n        text: item.text,\n        checked: item.checked,\n        parentId,\n        position: index,\n        createdAt: source.createdAt,\n        updatedAt: source.updatedAt,\n      });\n    });\n"""
          if text.count(old) != 1:
              raise SystemExit('Keep checklist ID anchor not found')
          repo.write_text(text.replace(old, new, 1))

          shell = Path('src/app/AppShell.tsx')
          text = shell.read_text()
          replacements = {
            "description: 'Protect the complete local library and recover it when needed.',":
              "description: 'Protect, recover, or move notes in from Google Keep.',",
            "emptyDescription: 'Export or restore the complete local library.',":
              "emptyDescription: 'Export, restore, or import a Google Keep Takeout archive.',",
            "label: 'Backup and restore',": "label: 'Backup, restore, and import',",
            "description: 'Export or recover the complete local library',":
              "description: 'Export, recover, or import Google Keep Takeout',",
            "keywords: ['backup', 'restore', 'recovery', 'export'],":
              "keywords: ['backup', 'restore', 'recovery', 'export', 'import', 'google', 'keep', 'takeout'],",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'AppShell anchor not found: {old}')
              text = text.replace(old, new, 1)
          shell.write_text(text)
          PY
      - name: Format P13 files
        run: >-
          npx prettier --write
          package.json
          docs/GOOGLE_KEEP_IMPORT.md
          e2e/google-keep-import.spec.ts
          src/app/AppShell.tsx
          src/features/backup/BackupWorkspace.tsx
          src/features/import/GoogleKeepImportPanel.tsx
          src/features/import/googleKeepImport.ts
          src/features/import/googleKeepImport.test.ts
          src/features/import/googleKeepRepository.ts
          src/styles/backup.css
      - name: Commit integrated P13 files
        run: |
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add package.json docs/GOOGLE_KEEP_IMPORT.md e2e/google-keep-import.spec.ts src/app/AppShell.tsx src/features/backup/BackupWorkspace.tsx src/features/import/GoogleKeepImportPanel.tsx src/features/import/googleKeepImport.ts src/features/import/googleKeepImport.test.ts src/features/import/googleKeepRepository.ts src/styles/backup.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate Google Keep Takeout import"
          git push origin HEAD:main
