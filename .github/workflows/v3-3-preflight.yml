name: V3-3 Organization Navigation Preflight

on:
  push:
    branches: [v3-3-organization-navigation-polish]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-3-organization-navigation-polish

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Settle V3.3 integration
        run: python scripts/v3-3-cleanup.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format V3.3 files
        run: |
          npx prettier --write src/app/AppShell.tsx src/components/AppSidebar.tsx src/features/notes/NotesWorkspace.tsx src/features/organization src/styles/organization-navigation-polish.css src/styles.css e2e/organization-navigation-polish.spec.ts
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/AppShell.tsx src/components/AppSidebar.tsx src/features/notes/NotesWorkspace.tsx src/features/organization src/styles/organization-navigation-polish.css src/styles.css e2e/organization-navigation-polish.spec.ts
            git commit -m "V3.3: settle organization navigation candidate"
            git push origin HEAD:v3-3-organization-navigation-polish
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: V3.3 browser certification
        run: npx playwright test e2e/organization-navigation-polish.spec.ts --retries=0
