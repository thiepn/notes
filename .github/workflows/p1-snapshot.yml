name: P1 foundation workspace
on:
  push:
    branches: [feat/p1-foundation]
    paths: [.github/workflows/p1-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Package source
        run: |
          mkdir -p /tmp/p1
          git archive --format=tar.gz HEAD > /tmp/p1/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: notes-p1-source
          path: /tmp/p1/source.tar.gz
          retention-days: 2
