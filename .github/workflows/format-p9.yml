name: Format P9

on:
  push:
    paths:
      - '.github/workflows/format-p9.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Format P9 files
        run: >-
          npx prettier --write
          e2e/search.spec.ts
          src/features/search/searchEngine.test.ts
          src/features/search/searchEngine.ts
          src/features/search/searchRepository.ts
          src/features/search/SearchWorkspace.tsx
          src/styles/search.css
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name thiepn
          git config user.email junsosmart@gmail.com
          git add e2e/search.spec.ts src/features/search/searchEngine.test.ts src/features/search/searchEngine.ts src/features/search/searchRepository.ts src/features/search/SearchWorkspace.tsx src/styles/search.css
          git commit -m "style: format P9 search system"
          git push origin HEAD:main
