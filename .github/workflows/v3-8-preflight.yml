name: V3-8 Privacy Security Preflight

on:
  push:
    branches: [v3-8-privacy-security-polish]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v3-8-privacy-security-polish

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Defer privacy settings modal
        run: |
          python scripts/v3-8-lazy-privacy.py
          npx prettier --write src/components/AppHeader.tsx
          if ! git diff --quiet -- src/components/AppHeader.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/AppHeader.tsx
            git commit -m "V3.8: defer privacy settings modal"
            git push origin HEAD:v3-8-privacy-security-polish
          fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Privacy regression preflight
        run: npx playwright test e2e/privacy.spec.ts --retries=0
