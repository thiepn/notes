name: P2 shell workspace
on:
  push:
    branches: [feat/p2-shell-responsive-ux]
    paths: [.github/workflows/p2-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Package source
        run: |
          mkdir -p /tmp/p2
          git archive --format=tar.gz HEAD > /tmp/p2/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: notes-p2-source
          path: /tmp/p2/source.tar.gz
          retention-days: 2
