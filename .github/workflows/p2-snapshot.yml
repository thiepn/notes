name: P2 shell implementation
on:
  push:
    branches: [feat/p2-shell-responsive-ux]
    paths: [.github/workflows/p2-snapshot.yml]
permissions:
  contents: write
concurrency:
  group: notes-p2-shell
  cancel-in-progress: true
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/p2-shell-responsive-ux
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Apply P2 shell architecture
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text()
              actual=text.count(old)
              assert actual==count, f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}'
              p.write_text(text.replace(old,new))

          Path('src/app/shellLayout.ts').write_text(r'''export type ShellViewport = 'mobile' | 'tablet' | 'desktop';
          export type DesktopSidebarPreference = 'expanded' | 'compact';

          export const SHELL_BREAKPOINTS = {
            mobileMax: 767,
            tabletMax: 1100,
          } as const;

          export const DESKTOP_SIDEBAR_STORAGE_KEY = 'notes.shell.sidebar';

          interface StorageReader {
            getItem(key: string): string | null;
          }

          interface StorageWriter extends StorageReader {
            setItem(key: string, value: string): void;
          }

          export function resolveShellViewport(width: number): ShellViewport {
            if (width <= SHELL_BREAKPOINTS.mobileMax) return 'mobile';
            if (width <= SHELL_BREAKPOINTS.tabletMax) return 'tablet';
            return 'desktop';
          }

          export function readDesktopSidebarPreference(
            storage: StorageReader | null = defaultStorage(),
          ): DesktopSidebarPreference {
            try {
              return storage?.getItem(DESKTOP_SIDEBAR_STORAGE_KEY) === 'compact' ? 'compact' : 'expanded';
            } catch {
              return 'expanded';
            }
          }

          export function writeDesktopSidebarPreference(
            preference: DesktopSidebarPreference,
            storage: StorageWriter | null = defaultStorage(),
          ): void {
            try {
              storage?.setItem(DESKTOP_SIDEBAR_STORAGE_KEY, preference);
            } catch {
              // Layout persistence is optional; navigation remains usable for the current session.
            }
          }

          function defaultStorage(): Storage | null {
            if (typeof window === 'undefined') return null;
            return window.localStorage;
          }
          ''')

          Path('src/app/shellLayout.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';

          import {
            DESKTOP_SIDEBAR_STORAGE_KEY,
            readDesktopSidebarPreference,
            resolveShellViewport,
            writeDesktopSidebarPreference,
          } from './shellLayout';

          describe('shell layout contract', () => {
            it.each([
              [320, 'mobile'],
              [767, 'mobile'],
              [768, 'tablet'],
              [820, 'tablet'],
              [1100, 'tablet'],
              [1101, 'desktop'],
              [1920, 'desktop'],
            ] as const)('maps %ipx to %s', (width, expected) => {
              expect(resolveShellViewport(width)).toBe(expected);
            });

            it('persists only the desktop sidebar preference', () => {
              const values = new Map<string, string>();
              const storage = {
                getItem: (key: string) => values.get(key) ?? null,
                setItem: (key: string, value: string) => values.set(key, value),
              };

              expect(readDesktopSidebarPreference(storage)).toBe('expanded');
              writeDesktopSidebarPreference('compact', storage);
              expect(values.get(DESKTOP_SIDEBAR_STORAGE_KEY)).toBe('compact');
              expect(readDesktopSidebarPreference(storage)).toBe('compact');
              writeDesktopSidebarPreference('expanded', storage);
              expect(readDesktopSidebarPreference(storage)).toBe('expanded');
            });

            it('falls back to expanded when storage is unavailable or invalid', () => {
              expect(readDesktopSidebarPreference(null)).toBe('expanded');
              expect(readDesktopSidebarPreference({ getItem: () => 'broken' })).toBe('expanded');
              expect(
                readDesktopSidebarPreference({
                  getItem: () => {
                    throw new Error('storage blocked');
                  },
                }),
              ).toBe('expanded');
            });
          });
          ''')

          Path('src/components/AppSidebar.tsx').write_text(r'''import { useRef, useState } from 'react';
          import {
            Archive,
            Bell,
            Command,
            DatabaseBackup,
            Lightbulb,
            Pencil,
            Plus,
            Search,
            Settings2,
            Tag,
            Trash2,
            X,
          } from 'lucide-react';

          import type { LabelRecord } from '../db';
          import type { NavigationStats } from '../features/organization/navigationStats';
          import { SyncIndicator } from '../features/sync/SyncIndicator';
          import { useDialogFocusTrap } from './ui/useDialogFocusTrap';

          export type AppSection = 'notes' | 'reminders' | 'archive' | 'trash' | 'backup';

          interface AppSidebarProps {
            activeSection: AppSection;
            activeLabelId: string | null;
            searchActive: boolean;
            labels: LabelRecord[];
            counts: NavigationStats;
            compact: boolean;
            mobileOpen: boolean;
            mobile: boolean;
            tablet: boolean;
            onNavigate: (section: AppSection) => void;
            onSearch: () => void;
            onLabelNavigate: (labelId: string) => void;
            onManageLabels: () => void;
            onCreateNote: () => void;
            onCommands: () => void;
            onSettings: () => void;
            onCloseNavigation: () => void;
          }

          const WORKSPACE_NAVIGATION = [
            { id: 'notes', label: 'Notes', icon: Lightbulb },
            { id: 'search', label: 'Search', icon: Search },
            { id: 'reminders', label: 'Reminders', icon: Bell },
          ] as const;

          const LIBRARY_NAVIGATION = [
            { id: 'archive', label: 'Archive', icon: Archive },
            { id: 'trash', label: 'Trash', icon: Trash2 },
          ] satisfies Array<{ id: AppSection; label: string; icon: typeof Lightbulb }>;

          export function AppSidebar({
            activeSection,
            activeLabelId,
            searchActive,
            labels,
            counts,
            compact,
            mobileOpen,
            mobile,
            tablet,
            onNavigate,
            onSearch,
            onLabelNavigate,
            onManageLabels,
            onCreateNote,
            onCommands,
            onSettings,
            onCloseNavigation,
          }: AppSidebarProps) {
            const sidebarRef = useRef<HTMLElement>(null);
            useDialogFocusTrap(sidebarRef, { enabled: mobile && mobileOpen });
            const [labelQuery, setLabelQuery] = useState('');
            const showLabelSearch = labels.length >= 6 && !compact;
            const normalizedLabelQuery = showLabelSearch ? labelQuery.trim().toLocaleLowerCase() : '';
            const visibleLabels = normalizedLabelQuery
              ? labels.filter((label) => label.name.toLocaleLowerCase().includes(normalizedLabelQuery))
              : labels;

            const navigateLabel = (labelId: string) => {
              setLabelQuery('');
              onLabelNavigate(labelId);
            };

            return (
              <aside
                ref={sidebarRef}
                tabIndex={-1}
                className="app-sidebar"
                id="app-navigation"
                role={mobile && mobileOpen ? 'dialog' : undefined}
                aria-modal={mobile && mobileOpen ? true : undefined}
                aria-label="Primary navigation"
                aria-hidden={mobile && !mobileOpen}
                data-compact={compact}
                data-open={mobileOpen}
                data-tablet={tablet}
                data-testid="app-sidebar"
                inert={mobile && !mobileOpen}
              >
                {mobile ? (
                  <div className="sidebar-mobile-heading">
                    <strong>Navigation</strong>
                    <button type="button" aria-label="Hide navigation" onClick={onCloseNavigation}>
                      <X aria-hidden="true" />
                    </button>
                  </div>
                ) : null}
                <nav className="sidebar-nav">
                  <button
                    type="button"
                    className="sidebar-capture"
                    onClick={onCreateNote}
                    aria-label="Write a new note"
                    title={compact ? 'New note' : undefined}
                  >
                    <Plus aria-hidden="true" />
                    <span>New note</span>
                    <kbd>C</kbd>
                  </button>
                  <p className="sidebar-eyebrow">Workspace</p>
                  {WORKSPACE_NAVIGATION.map(({ id, label, icon: Icon }) => {
                    const active =
                      id === 'search'
                        ? searchActive
                        : !searchActive &&
                          activeSection === id &&
                          (id !== 'notes' || activeLabelId === null);
                    const count =
                      id === 'notes' ? counts.notes : id === 'reminders' ? counts.reminders : null;
                    const activate = id === 'search' ? onSearch : () => onNavigate(id);
                    return (
                      <button
                        className="nav-item"
                        aria-label={label}
                        title={compact ? label : undefined}
                        type="button"
                        data-active={active}
                        aria-current={active ? 'page' : undefined}
                        onClick={activate}
                        key={id}
                      >
                        <Icon aria-hidden="true" />
                        <span className="nav-label">{label}</span>
                        {count !== null ? (
                          <span className="nav-count" aria-hidden="true">
                            {count}
                          </span>
                        ) : null}
                      </button>
                    );
                  })}

                  <div className="sidebar-section sidebar-label-section">
                    <div className="sidebar-section-heading">
                      <Tag aria-hidden="true" />
                      <span>Labels</span>
                      <button
                        className="sidebar-label-manager"
                        type="button"
                        aria-label="Edit labels"
                        title="Edit labels"
                        onClick={onManageLabels}
                      >
                        <Pencil aria-hidden="true" />
                      </button>
                    </div>

                    {showLabelSearch ? (
                      <label className="sidebar-label-search">
                        <Search aria-hidden="true" />
                        <span className="sr-only">Find labels</span>
                        <input
                          type="search"
                          aria-label="Find labels"
                          placeholder="Find labels"
                          value={labelQuery}
                          onChange={(event) => setLabelQuery(event.target.value)}
                        />
                      </label>
                    ) : null}

                    {labels.length > 0 ? (
                      visibleLabels.length > 0 ? (
                        <div className="sidebar-label-list">
                          {visibleLabels.map((label) => {
                            const active = !searchActive && activeLabelId === label.id;
                            return (
                              <button
                                className="nav-item sidebar-label-item"
                                aria-label={label.name}
                                type="button"
                                data-active={active}
                                aria-current={active ? 'page' : undefined}
                                onClick={() => navigateLabel(label.id)}
                                key={label.id}
                              >
                                <Tag aria-hidden="true" />
                                <span className="nav-label">{label.name}</span>
                                <span className="nav-count" aria-hidden="true">
                                  {counts.labels[label.id] ?? 0}
                                </span>
                              </button>
                            );
                          })}
                        </div>
                      ) : (
                        <p className="sidebar-label-empty">No matching labels</p>
                      )
                    ) : (
                      <button className="sidebar-empty-labels" type="button" onClick={onManageLabels}>
                        No labels yet
                      </button>
                    )}
                  </div>

                  <div className="sidebar-section sidebar-library-section">
                    <div className="sidebar-section-heading sidebar-section-heading-static">
                      <Archive aria-hidden="true" />
                      <span>Library</span>
                    </div>
                    {LIBRARY_NAVIGATION.map(({ id, label, icon: Icon }) => {
                      const active = !searchActive && activeSection === id && activeLabelId === null;
                      const count = id === 'archive' ? counts.archive : counts.trash;
                      return (
                        <button
                          className="nav-item"
                          aria-label={label}
                          title={compact ? label : undefined}
                          type="button"
                          data-active={active}
                          aria-current={active ? 'page' : undefined}
                          onClick={() => onNavigate(id)}
                          key={id}
                        >
                          <Icon aria-hidden="true" />
                          <span className="nav-label">{label}</span>
                          <span className="nav-count" aria-hidden="true">
                            {count}
                          </span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="sidebar-section sidebar-utilities-section">
                    <button
                      type="button"
                      className="nav-item"
                      aria-label="Backup & import"
                      title={compact ? 'Backup & import' : undefined}
                      data-active={!searchActive && activeSection === 'backup'}
                      aria-current={!searchActive && activeSection === 'backup' ? 'page' : undefined}
                      onClick={() => onNavigate('backup')}
                    >
                      <DatabaseBackup aria-hidden="true" />
                      <span className="nav-label">Backup & import</span>
                    </button>
                    <button
                      type="button"
                      className="nav-item"
                      aria-label="Settings"
                      title={compact ? 'Settings' : undefined}
                      onClick={onSettings}
                    >
                      <Settings2 aria-hidden="true" />
                      <span className="nav-label">Settings</span>
                    </button>
                    <button
                      type="button"
                      className="nav-item"
                      aria-label="Commands"
                      title={compact ? 'Commands' : undefined}
                      onClick={onCommands}
                    >
                      <Command aria-hidden="true" />
                      <span className="nav-label">Commands</span>
                      <kbd>Ctrl K</kbd>
                    </button>
                  </div>
                </nav>
                <div className="sidebar-footer">
                  <SyncIndicator />
                </div>
              </aside>
            );
          }
          ''')

          replace('src/components/AppHeader.tsx',
            '<IconButton\n          label="Toggle navigation"',
            '<IconButton\n          className="header-navigation-action"\n          label="Toggle navigation"')
          replace('src/components/AppHeader.tsx',
            '<IconButton label="Open command palette" onClick={onCommandPalette}>',
            '<IconButton className="header-command-action" label="Open command palette" onClick={onCommandPalette}>')
          replace('src/components/AppHeader.tsx',
            '<IconButton label="Open settings" onClick={onSettings}>',
            '<IconButton className="header-settings-action" label="Open settings" onClick={onSettings}>')
          replace('src/components/AppHeader.tsx',
            'ref={moreButtonRef}\n          label="More options"',
            'ref={moreButtonRef}\n          className="header-more-action"\n          label="More options"')
          replace('src/components/AppHeader.tsx',
            'className="search-inline-action"\n            type="button"\n            aria-label={currentIsSaved ? \'Search saved\' : \'Save search\'}',
            'className="search-inline-action search-save-action"\n            type="button"\n            aria-label={currentIsSaved ? \'Search saved\' : \'Save search\'}')

          replace('src/app/AppShell.tsx',
            "import { subscribeAppEvent } from './events';",
            "import { subscribeAppEvent } from './events';\nimport {\n  readDesktopSidebarPreference,\n  resolveShellViewport,\n  writeDesktopSidebarPreference,\n  type DesktopSidebarPreference,\n  type ShellViewport,\n} from './shellLayout';")
          replace('src/app/AppShell.tsx', "const MOBILE_QUERY = '(max-width: 767px)';\n", '')
          replace('src/app/AppShell.tsx',
            "  const [sidebarCompact, setSidebarCompact] = useState(false);\n  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);",
            "  const [desktopSidebarPreference, setDesktopSidebarPreference] =\n    useState<DesktopSidebarPreference>(() => readDesktopSidebarPreference());\n  const [tabletSidebarExpanded, setTabletSidebarExpanded] = useState(false);\n  const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);")
          replace('src/app/AppShell.tsx',
            "  const [isMobile, setIsMobile] = useState(() =>\n    typeof window === 'undefined' ? false : window.matchMedia(MOBILE_QUERY).matches,\n  );\n\n  const searchFiltersActive",
            "  const [viewportMode, setViewportMode] = useState<ShellViewport>(() =>\n    typeof window === 'undefined' ? 'desktop' : resolveShellViewport(window.innerWidth),\n  );\n  const isMobile = viewportMode === 'mobile';\n  const isTablet = viewportMode === 'tablet';\n  const sidebarCompact = isMobile\n    ? false\n    : isTablet\n      ? !tabletSidebarExpanded\n      : desktopSidebarPreference === 'compact';\n\n  const searchFiltersActive")
          old_media = r'''  useEffect(() => {
            const mediaQuery = window.matchMedia(MOBILE_QUERY);
            const handleChange = (event: MediaQueryListEvent) => {
              setIsMobile(event.matches);
              if (!event.matches) {
                setMobileSidebarOpen(false);
              }
            };

            mediaQuery.addEventListener('change', handleChange);
            return () => mediaQuery.removeEventListener('change', handleChange);
          }, []);

          useEffect(() => {
            if (!mobileSidebarOpen) return;

            const handleKeyDown = (event: KeyboardEvent) => {
              if (event.key === 'Escape') setMobileSidebarOpen(false);
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [mobileSidebarOpen]);

          const handleMenu = () => {
            if (isMobile) {
              setMobileSidebarOpen((open) => !open);
              return;
            }

            setSidebarCompact((compact) => !compact);
          };
          '''
          new_media = r'''  useEffect(() => {
            const handleResize = () => {
              const nextMode = resolveShellViewport(window.innerWidth);
              setViewportMode(nextMode);
              if (nextMode !== 'mobile') setMobileSidebarOpen(false);
              if (nextMode !== 'tablet') setTabletSidebarExpanded(false);
            };

            window.addEventListener('resize', handleResize, { passive: true });
            return () => window.removeEventListener('resize', handleResize);
          }, []);

          useEffect(() => {
            if (!mobileSidebarOpen && !tabletSidebarExpanded) return;

            const handleKeyDown = (event: KeyboardEvent) => {
              if (event.key !== 'Escape') return;
              if (isMobile) setMobileSidebarOpen(false);
              if (isTablet) setTabletSidebarExpanded(false);
            };

            window.addEventListener('keydown', handleKeyDown);
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [isMobile, isTablet, mobileSidebarOpen, tabletSidebarExpanded]);

          const handleMenu = () => {
            if (isMobile) {
              setMobileSidebarOpen((open) => !open);
              return;
            }
            if (isTablet) {
              setTabletSidebarExpanded((expanded) => !expanded);
              return;
            }

            setDesktopSidebarPreference((current) => {
              const next = current === 'expanded' ? 'compact' : 'expanded';
              writeDesktopSidebarPreference(next);
              return next;
            });
          };
          '''
          replace('src/app/AppShell.tsx', old_media, new_media)

          replace('src/app/AppShell.tsx',
            "      setCommandPaletteOpen(false);\n\n      if (isMobile) setMobileSidebarOpen(false);\n    },\n    [clearSearch, isMobile],\n  );",
            "      setCommandPaletteOpen(false);\n      setMobileSidebarOpen(false);\n      setTabletSidebarExpanded(false);\n    },\n    [clearSearch],\n  );",
            2)
          replace('src/app/AppShell.tsx',
            "      captureRequestIdRef.current += 1;\n      setCaptureRequest({ id: captureRequestIdRef.current, kind });",
            "      setMobileSidebarOpen(false);\n      setTabletSidebarExpanded(false);\n      captureRequestIdRef.current += 1;\n      setCaptureRequest({ id: captureRequestIdRef.current, kind });")
          replace('src/app/AppShell.tsx',
            "  const focusSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFocusRequest((request) => request + 1);\n  }, []);",
            "  const focusSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFocusRequest((request) => request + 1);\n  }, []);\n\n  const openSearch = useCallback(() => {\n    setCommandPaletteOpen(false);\n    setSearchFiltersOpen(true);\n    setSearchFocusRequest((request) => request + 1);\n    setMobileSidebarOpen(false);\n    setTabletSidebarExpanded(false);\n  }, []);")
          replace('src/app/AppShell.tsx',
            '<div className="app-shell">',
            '<div\n      className="app-shell"\n      data-viewport={viewportMode}\n      data-sidebar={sidebarCompact ? \'compact\' : \'expanded\'}\n    >')
          replace('src/app/AppShell.tsx',
            'navigationOpen={isMobile ? mobileSidebarOpen : !sidebarCompact}',
            "navigationOpen={\n          isMobile\n            ? mobileSidebarOpen\n            : isTablet\n              ? tabletSidebarExpanded\n              : desktopSidebarPreference === 'expanded'\n        }")
          replace('src/app/AppShell.tsx',
            "          activeLabelId={activeLabel?.id ?? null}\n          labels={labels}",
            "          activeLabelId={activeLabel?.id ?? null}\n          searchActive={searchActive}\n          labels={labels}")
          replace('src/app/AppShell.tsx',
            "          mobileOpen={mobileSidebarOpen}\n          mobile={isMobile}\n          onNavigate={handleNavigate}",
            "          mobileOpen={mobileSidebarOpen}\n          mobile={isMobile}\n          tablet={isTablet}\n          onNavigate={handleNavigate}\n          onSearch={openSearch}")
          replace('src/app/AppShell.tsx',
            "          onCommands={() => {\n            setMobileSidebarOpen(false);\n            setCommandPaletteOpen(true);\n          }}\n          onCloseNavigation",
            "          onCommands={() => {\n            setMobileSidebarOpen(false);\n            setTabletSidebarExpanded(false);\n            setCommandPaletteOpen(true);\n          }}\n          onSettings={() => {\n            setMobileSidebarOpen(false);\n            setTabletSidebarExpanded(false);\n            setSettingsInitialSection('appearance');\n            setSettingsOpen(true);\n          }}\n          onCloseNavigation")
          replace('src/app/AppShell.tsx',
            '<button type="button" aria-label="Find a note" onClick={focusSearch}>',
            '<button\n          type="button"\n          aria-label="Find a note"\n          aria-current={searchActive ? \'page\' : undefined}\n          onClick={openSearch}\n        >')

          Path('src/styles/shell.css').write_text(r'''.app-shell {
            --shell-sidebar-current: var(--sidebar-width);
            min-height: 100dvh;
