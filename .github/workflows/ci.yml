name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture formatting diff
        run: |
          npx prettier --write pwa-e2e/reminders-offline.spec.ts
          git diff -- pwa-e2e/reminders-offline.spec.ts | tee prettier-pwa.diff
          test ! -s prettier-pwa.diff

      - name: Upload formatting diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-pwa-diff
          path: prettier-pwa.diff
          if-no-files-found: error
