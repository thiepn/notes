name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v2-1-reminders

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Fix V2-1 E2E release blockers
        run: |
          exec > >(tee e2e-fix-output.txt) 2>&1
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          backup = "e2e/backup.spec.ts"
          replace_once(
              backup,
              "    const revisions = new dbModule.RevisionsRepository(dbModule.notesDatabase);\n",
              "    const revisions = new dbModule.RevisionsRepository(dbModule.notesDatabase);\n    const reminders = new dbModule.RemindersRepository(dbModule.notesDatabase);\n",
          )
          replace_once(
              backup,
              "    text = await notes.archive(text.id, text.revision);\n",
              "    text = await notes.archive(text.id, text.revision);\n    const reminderDueAt = Date.now() + 60 * 60 * 1000;\n    const reminder = await reminders.set(text.id, {\n      dueAt: reminderDueAt,\n      timeZone: 'Europe/Berlin',\n    });\n",
          )
          replace_once(
              backup,
              "      attachmentId,\n    };",
              "      attachmentId,\n      reminderId: reminder.id,\n      reminderDueAt,\n    };",
          )
          replace_once(
              backup,
              "test('full backup round-trips every v1 table and downloads a pre-restore safety backup'",
              "test('full backup round-trips every v2 table and downloads a pre-restore safety backup'",
          )
          replace_once(
              backup,
              "      revisions: Array<{ noteId: string; payload: string }>;\n",
              "      reminders: Array<{\n        id: string;\n        noteId: string;\n        dueAt: number;\n        timeZone: string;\n        status: string;\n      }>;\n      revisions: Array<{ noteId: string; payload: string }>;\n",
          )
          replace_once(backup, "  expect(exported.formatVersion).toBe(1);", "  expect(exported.formatVersion).toBe(2);")
          replace_once(
              backup,
              "  expect(exported.data.attachments).toHaveLength(1);\n",
              "  expect(exported.data.attachments).toHaveLength(1);\n  expect(exported.data.reminders).toHaveLength(1);\n  expect(exported.data.reminders[0]).toEqual(\n    expect.objectContaining({\n      id: ids.reminderId,\n      noteId: ids.textId,\n      dueAt: ids.reminderDueAt,\n      timeZone: 'Europe/Berlin',\n      status: 'active',\n    }),\n  );\n",
          )
          replace_once(
              backup,
              """    await dbModule.notesDatabase.transaction(
                'rw',
                dbModule.notesDatabase.notes,
                dbModule.notesDatabase.checklistItems,
                dbModule.notesDatabase.labels,
                dbModule.notesDatabase.noteLabels,
                dbModule.notesDatabase.attachments,
                dbModule.notesDatabase.revisions,
                dbModule.notesDatabase.settings,
                async () => {""",
              """    await dbModule.notesDatabase.transaction(
                'rw',
                [
                  dbModule.notesDatabase.notes,
                  dbModule.notesDatabase.checklistItems,
                  dbModule.notesDatabase.labels,
                  dbModule.notesDatabase.noteLabels,
                  dbModule.notesDatabase.attachments,
                  dbModule.notesDatabase.reminders,
                  dbModule.notesDatabase.revisions,
                  dbModule.notesDatabase.settings,
                ],
                async () => {""",
          )
          replace_once(
              backup,
              "        await dbModule.notesDatabase.attachments.clear();\n        await dbModule.notesDatabase.revisions.clear();",
              "        await dbModule.notesDatabase.attachments.clear();\n        await dbModule.notesDatabase.reminders.clear();\n        await dbModule.notesDatabase.revisions.clear();",
          )
          replace_once(
              backup,
              "    const [notes, items, labels, relations, attachments, revisions, settings] = await Promise.all([",
              "    const [notes, items, labels, relations, attachments, reminders, revisions, settings] =\n      await Promise.all([",
          )
          replace_once(
              backup,
              "      dbModule.notesDatabase.attachments.toArray(),\n      dbModule.notesDatabase.revisions.toArray(),",
              "      dbModule.notesDatabase.attachments.toArray(),\n      dbModule.notesDatabase.reminders.toArray(),\n      dbModule.notesDatabase.revisions.toArray(),",
          )
          replace_once(
              backup,
              "    const attachment = attachments.find((record) => record.id === expected.attachmentId);\n    return {",
              "    const attachment = attachments.find((record) => record.id === expected.attachmentId);\n    const reminder = reminders.find((record) => record.id === expected.reminderId);\n    return {",
          )
          replace_once(
              backup,
              "      attachmentChecksum: attachment?.checksum ?? null,\n      revisionNoteIds:",
              "      attachmentChecksum: attachment?.checksum ?? null,\n      reminder: reminder\n        ? {\n            id: reminder.id,\n            noteId: reminder.noteId,\n            dueAt: reminder.dueAt,\n            timeZone: reminder.timeZone,\n            status: reminder.status,\n          }\n        : null,\n      revisionNoteIds:",
          )
          replace_once(
              backup,
              "  expect(restored.attachmentChecksum).toBe('source-checksum');\n  expect(restored.revisionNoteIds).toContain(ids.textId);",
              "  expect(restored.attachmentChecksum).toBe('source-checksum');\n  expect(restored.reminder).toEqual({\n    id: ids.reminderId,\n    noteId: ids.textId,\n    dueAt: ids.reminderDueAt,\n    timeZone: 'Europe/Berlin',\n    status: 'active',\n  });\n  expect(restored.revisionNoteIds).toContain(ids.textId);",
          )

          reminders = "e2e/reminders.spec.ts"
          replace_once(
              reminders,
              "  const reminderCard = page.locator('[data-note-card]').filter({ hasText: 'Call tomorrow' });\n  await reminderCard.getByRole('button', { name: 'Move note to trash: Call tomorrow' }).click();",
              "  const reminderCard = page.locator('[data-note-card]').filter({ hasText: 'Call tomorrow' });\n  await reminderCard.hover();\n  await reminderCard.getByRole('button', { name: 'Move note to trash: Call tomorrow' }).click();",
          )
          replace_once(
              reminders,
              "  await page.getByRole('button', { name: 'Trash' }).click();\n  await page.getByRole('button', { name: 'Restore note: Call tomorrow' }).click();",
              "  await page.getByRole('button', { name: 'Trash' }).click();\n  const trashCard = page.locator('[data-note-card]').filter({ hasText: 'Call tomorrow' });\n  await trashCard.hover();\n  await trashCard.getByRole('button', { name: 'Restore note: Call tomorrow' }).click();",
          )
          PY

          npx prettier --write e2e/backup.spec.ts e2e/reminders.spec.ts
          npm run lint
          npm run typecheck
          npx playwright test e2e/backup.spec.ts e2e/reminders.spec.ts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/backup.spec.ts e2e/reminders.spec.ts
          git commit -m "test: align V2-1 browser regressions with release behavior"
          git push origin HEAD:v2-1-reminders

      - name: Upload focused fix diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-1-e2e-fix-output
          path: |
            e2e-fix-output.txt
            playwright-report
            test-results
          if-no-files-found: ignore
