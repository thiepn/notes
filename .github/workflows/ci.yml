name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v2-1-reminders

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Finalize V2-1 release contract
        run: |
          python3 scripts/finalize_v2_1_release.py
          npx prettier --write README.md docs/DATABASE.md docs/BACKUP.md docs/GOOGLE_KEEP_IMPORT.md .github/workflows/ci.yml
          npm run format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize V2-1 release contract"
          git push origin HEAD:v2-1-reminders
