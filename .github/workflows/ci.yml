name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full browser regression suite
        run: |
          set +e
          npm run e2e 2>&1 | tee v2-2-e2e.txt
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload V2-2 browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-2-browser-diagnostics
          path: |
            v2-2-e2e.txt
            playwright-report
            test-results
          if-no-files-found: ignore
