name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused rich-text E2E
        run: |
          set +e
          npx playwright test e2e/rich-text.spec.ts 2>&1 | tee rich-text-e2e.txt
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload rich-text diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rich-text-e2e-diagnostics
          path: |
            rich-text-e2e.txt
            playwright-report
            test-results
          if-no-files-found: ignore
