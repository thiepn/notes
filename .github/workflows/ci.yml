name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: v2-1-reminders

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply lint-safe reminder UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/features/notes/NoteCard.tsx",
              "          data-overdue={reminder.status === 'active' && reminder.dueAt < Date.now()}\n",
              "",
          )

          workspace = "src/features/reminders/RemindersWorkspace.tsx"
          replace_once(
              workspace,
              "const attachmentsRepository = new AttachmentsRepository(notesDatabase);\n",
              "const attachmentsRepository = new AttachmentsRepository(notesDatabase);\nconst INITIAL_REMINDER_NOW = Date.now();\n",
          )
          replace_once(
              workspace,
              "  const [now, setNow] = useState(Date.now());",
              "  const [now, setNow] = useState(INITIAL_REMINDER_NOW);",
          )
          replace_once(
              workspace,
              "    void reload().catch(() => {",
              "    void Promise.resolve().then(reload).catch(() => {",
          )

          control = "src/features/reminders/ReminderControl.tsx"
          replace_once(
              control,
              "import type { ReminderRecord, RemindersRepository } from '../../db';\n",
              "import type { ReminderRecord, RemindersRepository } from '../../db';\nimport { dispatchReminderChanged } from './reminderEvents';\n",
          )
          replace_once(
              control,
              "\nexport function dispatchReminderChanged(): void {\n  window.dispatchEvent(new CustomEvent('notes-reminders-changed'));\n}\n",
              "",
          )

          replace_once(
              "src/features/reminders/ReminderNotificationCoordinator.tsx",
              "import { dispatchReminderChanged } from './ReminderControl';",
              "import { dispatchReminderChanged } from './reminderEvents';",
          )

          events = Path("src/features/reminders/reminderEvents.ts")
          if events.exists():
              raise SystemExit("reminderEvents.ts already exists unexpectedly")
          events.write_text(
              "export function dispatchReminderChanged(): void {\n"
              "  window.dispatchEvent(new CustomEvent('notes-reminders-changed'));\n"
              "}\n"
          )
          PY

          npx prettier --write \
            src/features/notes/NoteCard.tsx \
            src/features/reminders/RemindersWorkspace.tsx \
            src/features/reminders/ReminderControl.tsx \
            src/features/reminders/ReminderNotificationCoordinator.tsx \
            src/features/reminders/reminderEvents.ts
          npm run lint
          npm run typecheck

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/notes/NoteCard.tsx \
            src/features/reminders/RemindersWorkspace.tsx \
            src/features/reminders/ReminderControl.tsx \
            src/features/reminders/ReminderNotificationCoordinator.tsx \
            src/features/reminders/reminderEvents.ts
          git commit -m "fix: satisfy React reminder UI invariants"
          git push origin HEAD:v2-1-reminders

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end regression suite
        run: npm run e2e

      - name: PWA offline certification
        run: npm run e2e:pwa
